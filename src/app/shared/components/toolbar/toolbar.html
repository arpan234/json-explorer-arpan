<mat-toolbar color="primary">
    <mat-icon class="app-icon">data_object</mat-icon>
    <h1 class="app-title">json-md-formatter</h1>

    <nav mat-tab-nav-bar [tabPanel]="tabPanel" class="nav-tabs">
        @for (link of navLinks; track link.path) {
            <a
                mat-tab-link
                [routerLink]="link.path"
                routerLinkActive
                #rla="routerLinkActive"
                [active]="rla.isActive"
                [routerLinkActiveOptions]="{ exact: link.path === '/' }"
            >
                <mat-icon class="nav-icon">{{ link.icon }}</mat-icon>
                <span class="nav-label">{{ link.label }}</span>
            </a>
        }
    </nav>

    <span class="spacer"></span>
    <button
        mat-icon-button
        (click)="toggleTheme()"
        [matTooltip]="isDark() ? 'Light mode' : 'Dark mode'"
    >
        <mat-icon>{{ isDark() ? 'light_mode' : 'dark_mode' }}</mat-icon>
    </button>
</mat-toolbar>
<mat-tab-nav-panel #tabPanel></mat-tab-nav-panel>
