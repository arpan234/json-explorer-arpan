<div class="tool-shell">
    <app-tool-guide part="intro" />
    <div class="viewer-container" [class.mobile-view]="isMobile()">
        <div class="mobile-nav-bar">
            <button
                mat-button
                class="mobile-nav-btn"
                [class.active]="activeMobileTab() === 'input'"
                (click)="activeMobileTab.set('input')"
            >
                <mat-icon>edit</mat-icon>
                Input
            </button>
            <button
                mat-button
                class="mobile-nav-btn"
                [class.active]="activeMobileTab() === 'output'"
                (click)="activeMobileTab.set('output')"
            >
                <mat-icon>visibility</mat-icon>
                Preview
            </button>
        </div>

        <!-- Left Panel: Input -->
        <div
            class="input-panel"
            [class.mobile-inactive]="activeMobileTab() !== 'input'"
            [style.width.%]="isMobile() ? 100 : panelWidth()"
        >
            <app-markdown-input
                [externalMarkdown]="markdownContent()"
                (markdownParsed)="onMarkdownInput($event)"
                (previewRequested)="activeMobileTab.set('output')"
            />
        </div>

        <!-- Resize Handle -->
        <div
            class="resize-handle"
            role="separator"
            tabindex="0"
            aria-label="Resize editor panels"
            aria-orientation="vertical"
            aria-valuemin="20"
            aria-valuemax="65"
            [attr.aria-valuenow]="panelWidth()"
            (keydown.arrowleft)="panelWidth.set(panelWidth() > 20 ? panelWidth() - 5 : 20)"
            (keydown.arrowright)="panelWidth.set(panelWidth() < 65 ? panelWidth() + 5 : 65)"
            (mousedown)="onResizeStart($event)"
        ></div>

        <!-- Right Panel: Preview -->
        <div class="output-panel" [class.mobile-inactive]="activeMobileTab() !== 'output'">
            @if (markdownContent()) {
                <app-markdown-preview [content]="markdownContent()" />
            } @else {
                <div class="welcome-container">
                    <div class="empty-state">
                        <mat-icon class="empty-icon">description</mat-icon>
                        <h2>No Markdown loaded</h2>
                        <p>
                            Paste Markdown in the input panel, drop a .md file, or try sample data
                            below.
                        </p>
                        <div class="empty-cta-group">
                            <button mat-flat-button (click)="loadSampleFromWelcome()">
                                <mat-icon>science</mat-icon>
                                Load Sample Markdown
                            </button>
                            @if (savedSessionMarkdown()) {
                                <button mat-stroked-button (click)="restoreSavedSession()">
                                    <mat-icon>history</mat-icon>
                                    Restore Last Session
                                </button>
                            }
                        </div>
                    </div>
                </div>
            }
        </div>
    </div>
</div>
<app-tool-guide part="guide" />
