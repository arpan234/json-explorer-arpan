<div
    class="input-container"
    (dragover)="onDragOver($event)"
    (dragleave)="onDragLeave()"
    (drop)="onDrop($event)"
    [class.drag-over]="isDragOver()"
>
    <div class="input-header">
        <span class="input-title">Markdown Input</span>
        <div class="input-actions">
            <button
                aria-label="Align & prettify Markdown tables"
                mat-button
                (click)="formatMarkdownTables()"
                matTooltip="Align & prettify Markdown tables"
            >
                <mat-icon>grid_on</mat-icon>
                Format Tables
            </button>
            <button mat-button (click)="onLoadSample()">
                <mat-icon>science</mat-icon>
                Sample
            </button>
            <button mat-button (click)="onClear()">
                <mat-icon>clear</mat-icon>
                Clear
            </button>
        </div>
    </div>

    <div class="format-toolbar">
        <button
            aria-label="Bold (**text**)"
            type="button"
            class="fmt-btn"
            (click)="insertFormatting('**', '**', 'bold')"
            matTooltip="Bold (**text**)"
        >
            <mat-icon>format_bold</mat-icon>
        </button>
        <button
            aria-label="Italic (*text*)"
            type="button"
            class="fmt-btn"
            (click)="insertFormatting('*', '*', 'italic')"
            matTooltip="Italic (*text*)"
        >
            <mat-icon>format_italic</mat-icon>
        </button>
        <button
            aria-label="Strikethrough (~~text~~)"
            type="button"
            class="fmt-btn"
            (click)="insertFormatting('~~', '~~', 'strikethrough')"
            matTooltip="Strikethrough (~~text~~)"
        >
            <mat-icon>strikethrough_s</mat-icon>
        </button>
        <div class="fmt-divider"></div>
        <button
            aria-label="Heading (## )"
            type="button"
            class="fmt-btn"
            (click)="insertLinePrefix('## ')"
            matTooltip="Heading (## )"
        >
            <mat-icon>title</mat-icon>
        </button>
        <button
            aria-label="Bullet List (- )"
            type="button"
            class="fmt-btn"
            (click)="insertLinePrefix('- ')"
            matTooltip="Bullet List (- )"
        >
            <mat-icon>format_list_bulleted</mat-icon>
        </button>
        <button
            aria-label="Insert Link"
            type="button"
            class="fmt-btn"
            (click)="insertFormatting('[', '](https://example.com)', 'link')"
            matTooltip="Insert Link"
        >
            <mat-icon>link</mat-icon>
        </button>
        <button
            aria-label="Insert Code Block"
            type="button"
            class="fmt-btn"
            (click)="insertFormatting('\n```typescript\n', '\n```\n', '// code')"
            matTooltip="Insert Code Block"
        >
            <mat-icon>code</mat-icon>
        </button>
        <button
            aria-label="Insert Markdown Table"
            type="button"
            class="fmt-btn"
            (click)="insertTableTemplate()"
            matTooltip="Insert Markdown Table"
        >
            <mat-icon>table_chart</mat-icon>
        </button>

        <span class="fmt-spacer"></span>
        @if (docStats(); as stats) {
            <span class="doc-stats">
                {{ stats.words }} words · {{ stats.chars }} chars · ~{{ stats.readingTimeMin }}m
                read
            </span>
        }
    </div>

    <textarea
        aria-label="Markdown source"
        #editorArea
        class="markdown-textarea"
        [ngModel]="inputText()"
        (ngModelChange)="inputText.set($event)"
        (input)="onInput()"
        placeholder="Paste or type your Markdown here..."
        spellcheck="false"
    ></textarea>

    <div class="input-footer">
        <button mat-flat-button (click)="onPreview()">
            <mat-icon>visibility</mat-icon>
            Preview
        </button>
        <input
            #fileInput
            type="file"
            accept=".md,.markdown,text/markdown"
            (change)="onFileSelect($event)"
            hidden
        />
        <button mat-stroked-button (click)="fileInput.click()">
            <mat-icon>upload_file</mat-icon>
            Upload File
        </button>
    </div>

    @if (isDragOver()) {
        <div class="drop-overlay">
            <mat-icon>file_download</mat-icon>
            <span>Drop Markdown file here</span>
        </div>
    }
</div>

@if (fileError()) {
    <p role="alert">{{ fileError() }}</p>
}
