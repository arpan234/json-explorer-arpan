<div
    class="input-container"
    (dragover)="onDragOver($event)"
    (dragleave)="onDragLeave()"
    (drop)="onDrop($event)"
    [class.drag-over]="isDragOver()"
>
    <div class="input-header">
        <span class="input-title">JSON Input</span>
        <div class="input-actions">
            <button
                mat-button
                (click)="onRepair()"
                matTooltip="Fix trailing commas, single quotes, unquoted keys, or escaped JSON"
            >
                <mat-icon>auto_fix_high</mat-icon>
                Repair
            </button>
            <button mat-button (click)="onMinify()" matTooltip="Minify / Compact JSON">
                <mat-icon>compress</mat-icon>
                Minify
            </button>
            <button mat-button (click)="onLoadSample()">
                <mat-icon>science</mat-icon>
                Sample
            </button>
            <button mat-button (click)="onClear()">
                <mat-icon>clear</mat-icon>
                Clear
            </button>
        </div>
    </div>

    <textarea
        class="json-textarea"
        [ngModel]="inputText()"
        (ngModelChange)="onTextChange($event)"
        (paste)="onPaste($event)"
        placeholder="Paste your JSON here..."
        spellcheck="false"
        (keydown.control.enter)="onParse()"
        (keydown.meta.enter)="onParse()"
    ></textarea>

    @if (error(); as err) {
        <div class="error-message">
            <div class="error-message__text">
                <mat-icon>error_outline</mat-icon>
                <span>{{ err }}</span>
            </div>
            <button mat-stroked-button class="repair-inline-btn" (click)="onRepair()">
                <mat-icon>auto_fix_high</mat-icon>
                Auto-Repair
            </button>
        </div>
    }

    <div class="input-footer">
        <button mat-flat-button (click)="onParse()">
            <mat-icon>play_arrow</mat-icon>
            Parse JSON
        </button>
        <input
            #fileInput
            type="file"
            accept=".json,application/json"
            (change)="onFileSelect($event)"
            hidden
        />
        <button mat-stroked-button (click)="fileInput.click()">
            <mat-icon>upload_file</mat-icon>
            Upload File
        </button>
    </div>

    @if (isDragOver()) {
        <div class="drop-overlay">
            <mat-icon>file_download</mat-icon>
            <span>Drop JSON file here</span>
        </div>
    }
</div>
