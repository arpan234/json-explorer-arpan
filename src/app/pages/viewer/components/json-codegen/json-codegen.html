<div class="codegen-container">
    <div class="codegen-header">
        <mat-button-toggle-group
            [ngModel]="selectedLanguage()"
            (ngModelChange)="selectedLanguage.set($event)"
            aria-label="Target language"
        >
            <mat-button-toggle value="markdown">Markdown</mat-button-toggle>
            <mat-button-toggle value="typescript">TypeScript</mat-button-toggle>
            <mat-button-toggle value="go">Go</mat-button-toggle>
            <mat-button-toggle value="python">Python</mat-button-toggle>
            <mat-button-toggle value="sql">SQL</mat-button-toggle>
        </mat-button-toggle-group>

        <div class="codegen-actions">
            @if (tokenSavings(); as stats) {
                @if (stats.savedPercent > 0) {
                    <span
                        class="token-saver-badge"
                        matTooltip="Rough estimate based on text patterns, not a model tokenizer. Actual usage varies by model and content."
                    >
                        Estimated: {{ stats.jsonTokens }} → {{ stats.mdTokens }} tokens (-{{
                            stats.savedPercent
                        }}%)
                    </span>
                }
            }
            @if (selectedLanguage() === 'markdown') {
                <button
                    aria-label="Preview generated Markdown in Markdown Reader"
                    mat-stroked-button
                    class="open-md-btn"
                    (click)="openInMarkdownReader()"
                    [disabled]="!generatedCode()"
                    matTooltip="Preview generated Markdown in Markdown Reader"
                >
                    <mat-icon>open_in_new</mat-icon>
                    Open in Markdown Reader
                </button>
            }
            <button
                aria-label="Copy generated code"
                mat-icon-button
                (click)="copyCode()"
                matTooltip="Copy generated code"
                [disabled]="!generatedCode()"
            >
                <mat-icon>content_copy</mat-icon>
            </button>
        </div>
    </div>

    <div class="editor-wrapper">
        <ngx-monaco-editor [options]="editorOptions()" [ngModel]="generatedCode()" />
    </div>
</div>
